name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest already has the Android SDK and cmdline-tools.
      # android-actions/setup-android@v3 runs `sdkmanager tools`, and cmdline-tools 16
      # no longer ships that legacy package, so the step exits 1.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set on this runner" >&2
            exit 1
          fi
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "${SDKMANAGER}" ]; then
            echo "sdkmanager not found under ${ANDROID_HOME}/cmdline-tools" >&2
            exit 1
          fi
          echo "Using ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --sdk_root="${ANDROID_HOME}" --licenses >/dev/null || true
          "${SDKMANAGER}" --sdk_root="${ANDROID_HOME}" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Sync web app into Android
        run: npm run sync:android

      - name: Build signed APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=1.0.${{ github.run_number }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk boets.apk

      - name: Verify launcher foreground
        run: |
          set -euo pipefail
          AAPT2="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt2 | sort | tail -n 1)"
          if [ -z "${AAPT2}" ]; then
            echo "aapt2 not found under ${ANDROID_HOME}/build-tools" >&2
            exit 1
          fi
          DUMP="$("${AAPT2}" dump resources boets.apk)"
          echo "${DUMP}" | grep ic_launcher_foreground
          FOREGROUND="$(echo "${DUMP}" | grep ic_launcher_foreground || true)"
          if echo "${FOREGROUND}" | grep -q 'drawable/ic_launcher_foreground'; then
            echo "ic_launcher_foreground is still a drawable resource" >&2
            exit 1
          fi
          if ! echo "${FOREGROUND}" | grep -q 'mipmap/ic_launcher_foreground'; then
            echo "mipmap/ic_launcher_foreground is missing from the APK" >&2
            exit 1
          fi
          if grep -a -q 'M32,64C32,64' boets.apk; then
            echo "Capacitor robot foreground is still packaged" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: АРСДРОЙД ${{ github.run_number }}
          make_latest: true
          files: boets.apk
          body: |
            Android-сборка «АРСДРОЙД — ЯРОСТЬ»: тренировки, меню и чтение шагов и тренировок из Health Connect.

            Скачать: https://github.com/2253595-sys/Training-app/releases/latest/download/boets.apk

            Установка:
            1. Разрешите установку из неизвестных источников.
            2. Откройте APK и установите приложение.
            3. На экране «Сегодня» разрешите Health Connect читать шаги и тренировки.
            4. Если Health Connect не установлен, приложение откроет Google Play.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
