name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Stage site
        run: |
          mkdir -p _site/data _site/brand _site/fonts _site/img/days _site/img/ex
          cp index.html app.js activity.js food.js icons.js styles.css tokens.css fonts.css sw.js manifest.webmanifest .nojekyll \
            favicon.png apple-touch-icon.png icon-192.png icon-512.png icon-maskable-192.png icon-maskable-512.png \
            _site/
          cp data/recipes.json data/menu-week.json data/shopping-week.json _site/data/
          cp brand/logo-horizontal-tight.svg brand/logo-compact.svg brand/logo-compact-tight.svg _site/brand/
          cp img/*.webp _site/img/
          if [ -d img/days ]; then
            cp img/days/*.webp _site/img/days/
          fi
          cp img/ex/* _site/img/ex/
          cp fonts/*.woff2 _site/fonts/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
